<html lang="en">
<head>
<meta charset="utf-8">

<title>About Kickresume</title>
<meta name="claude:viewport-fit-sides" content="cover">

<!-- Kickresume Design System: tokens, fonts and component styles (inlined by build.py) -->
<style>{{css:tokens.css}}</style>
<style>{{css:components/bundle.css}}</style>
<style>
/* Page layout only. Everything visual comes from the design system:
   tokens (--kr-*), the bundle's kr-* component classes, and the Card / List
   patterns from its component guidelines. */
body { margin: 0; background: var(--kr-bg); color: var(--kr-fg); font-family: var(--kr-font-sans); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
.kr-container { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
@media (max-width: 559px) { .kr-container { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
:focus-visible { outline: none; box-shadow: var(--kr-focus-ring-dark); border-radius: var(--kr-radius); }

/* Navbar component has no mobile layout: keep logo + CTAs on small screens */
@media (max-width: 991px) { .kr-nav__list { display: none; } }
@media (max-width: 479px) { .kr-nav__cta .kr-btn--coral-ol { display: none; } .kr-nav__row { gap: 12px; } }

/* Section rhythm: pt-5 pb-5 (80px) per the brand book */
.pg-section { padding: 80px 0; }
.pg-section--tint { background: linear-gradient(180deg, var(--kr-blue-very-light) 0%, var(--kr-white) 100%); }
.pg-section--coral { background: linear-gradient(180deg, var(--kr-primary-tint) 0%, var(--kr-white) 100%); }
.pg-section--grey { background: var(--kr-background); }
.pg-sub { font-size: 18px; line-height: 28px; margin: 0 auto; max-width: 640px; }
.kr-section-title .kr-h1 { text-wrap: balance; }
.button-group { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

/* Hero: centered, colored blurs on white (brand book: blurs only on white) */
.kr-hero--center { background: url("{{asset:backgrounds/bg-blurs.svg}}") center 70% / 120% auto no-repeat; padding-bottom: 32px; }
.kr-hero__title { text-wrap: balance; max-width: 900px; margin-left: auto; margin-right: auto; }

.pg-hero-art { width: 100%; max-width: 600px; height: auto; margin: 0 auto; display: block; }
.kr-btn { max-width: 100%; white-space: normal; text-align: center; }
.pg-intro { columns: 3 280px; column-gap: 48px; }
.pg-intro p { break-inside: avoid; margin: 0 0 20px; }

/* Card (components/Card): default / hover / tinted */
.ds-card { color: var(--kr-fg); background: var(--kr-white); border: 1px solid var(--kr-grey-60); border-radius: var(--kr-radius); padding: 20px 24px; transition: box-shadow .25s, border-color .25s; min-width: 0; }
a.ds-card { display: block; color: inherit; text-decoration: none; }
a.ds-card:hover { box-shadow: var(--kr-shadow-dropdown); border-color: transparent; }
.ds-card--tinted { background: var(--kr-background); border-color: transparent; }
.ds-card h3 { font: var(--kr-fw-medium) 18px/24px var(--kr-font-sans); margin: 12px 0 6px; }
.ds-card p { font-size: 16px; line-height: 24px; letter-spacing: var(--kr-tracking-body); margin: 0; }
.ds-card .muted { color: var(--kr-grey-80); font-size: 14px; letter-spacing: var(--kr-tracking-small); }
.ds-card i[data-lucide], .ds-card svg.lucide { width: 24px; height: 24px; color: var(--kr-fg); }
.pg-grid { display: grid; gap: 16px; }
.pg-grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pg-grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 991px) { .pg-grid--3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 639px) { .pg-grid--3, .pg-grid--2 { grid-template-columns: minmax(0, 1fr); } }

/* List (components/List): checked list, Lucide check in kr-green, 8px gap */
.k-checked { list-style: none; padding: 0; margin: 0; }
.k-checked li { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; font-size: 16px; line-height: 24px; }
.k-checked li svg.lucide, .k-checked li i { width: 20px; height: 20px; flex: none; color: var(--kr-green); margin-top: 2px; }
.k-checked strong { font-weight: var(--kr-fw-medium); }

/* FeatureRow layout (bundle kr-feature) with an art column we fill ourselves */
.kr-feature__col .button-group { justify-content: flex-start; }
.pg-art-card { border-radius: var(--kr-radius-md); padding: 32px; }
.pg-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; margin: 0; }
.pg-facts dt { font-size: 14px; color: var(--kr-grey-80); letter-spacing: var(--kr-tracking-small); }
.pg-facts dd { margin: 2px 0 0; font-weight: var(--kr-fw-medium); }
.pg-photo { aspect-ratio: 4 / 3; border-radius: var(--kr-radius-md); background: rgba(255,255,255,.08); border: 1px dashed rgba(255,255,255,.35); display: grid; place-items: center; text-align: center; color: rgba(255,255,255,.8); font-size: 14px; padding: 16px; }
.pg-photo figcaption { color: #fff; }
.pg-photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.pg-photos figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.pg-photos figcaption { font-size: 14px; color: #fff; opacity: .85; }
.pg-placeholder { aspect-ratio: 4 / 3; display: grid; place-items: center; text-align: center; color: var(--kr-grey-80); font-size: 14px; }
@media (max-width: 899px) { .kr-feature__row { grid-template-columns: minmax(0, 1fr); gap: 32px; } .kr-feature.is-reverse .kr-feature__row { direction: ltr; } .kr-feature__col { max-width: none; } }
@media (max-width: 479px) { .pg-facts, .pg-photos { grid-template-columns: minmax(0, 1fr); } }

/* Reviews section (TestimonialGrid layout: Forbes card + review cards) */
.kr-forbes__quote .kr-eyebrow { color: #fff; margin-bottom: 4px; font-family: var(--kr-font-sans); }
.kr-forbes__body { font-family: var(--kr-font-sans); font-size: 16px; line-height: 24px; }
.kr-forbes__byline { flex-shrink: 0; }
.kr-testi__grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 767px) { .kr-forbes { flex-direction: column; align-items: flex-start; padding: 28px 24px; } .kr-testi__grid { grid-template-columns: minmax(0, 1fr); } }
.kr-testi-card__logo { height: 24px; width: auto; align-self: flex-start; }

/* Founders / team cards on navy (FeatureRow dark band) */
.pg-team { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 48px; }
@media (max-width: 767px) { .pg-team { grid-template-columns: minmax(0, 1fr); } }
.pg-person { display: flex; gap: 16px; align-items: flex-start; }
.pg-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--kr-blue-very-light); color: var(--kr-blue); display: grid; place-items: center; font-weight: var(--kr-fw-medium); flex: none; }
.pg-person h3 { margin-top: 0; }
.pg-link { color: var(--kr-fg-link); font-weight: var(--kr-fw-medium); text-decoration: underline; text-underline-offset: 3px; }
.pg-link:hover { color: var(--kr-hover); }

/* Stats (type style .stat: Henk-Work 36/40) */
.pg-stat { font-family: var(--kr-font-display); font-size: 36px; line-height: 40px; display: block; margin-bottom: 8px; font-variant-numeric: tabular-nums; }

/* Press cards (SampleCarousel kr-sample-card) */
.pg-press { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 991px) { .pg-press { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 559px) { .pg-press { grid-template-columns: minmax(0, 1fr); } }
.kr-sample-card__body { height: 100%; }
.kr-sample-card__cta { margin-top: auto; }

/* FAQ */
.pg-faq { display: flex; flex-direction: column; gap: 16px; }

/* Footer (bundle kr-footer), ratings column with our numbers */
.kr-footer__top { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 899px) { .kr-footer__top { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kr-footer { margin-top: 0; }
.kr-footer__rating-label { font-size: 14px; font-weight: 500; }
.pg-updated { font-size: 13px; opacity: .7; margin: 16px 0 0; }

/* ================= Polish: buttons, type, 8px grid ================= */
/* Buttons: one size everywhere, 40px tall, 14px medium (1px border + 9px + 20px line + 9px + 1px) */
.kr-btn, .kr-btn--sm, .kr-btn--md, .kr-btn--lg { min-height: 40px; padding: 9px 24px; font-size: 14px; line-height: 20px; font-weight: var(--kr-fw-medium); white-space: nowrap; }
@media (max-width: 479px) { .kr-btn, .kr-btn--sm, .kr-btn--md, .kr-btn--lg { white-space: normal; } }
.button-group { gap: 16px; }

/* Henk-Work only for primary headings (hero h1, section h1/h2), regular weight only */
.kr-h1, .kr-h2 { font-weight: var(--kr-fw-regular); }
/* every Henk-Work heading: Heading/H1 48/56 */
.kr-h1, .kr-h2, .kr-hero__title, .kr-section-title .kr-h1 { font-size: 48px; line-height: 56px; letter-spacing: 0; }
@media (max-width: 559px) { .kr-h1, .kr-h2, .kr-hero__title, .kr-section-title .kr-h1 { font-size: 36px; line-height: 40px; } }
.kr-testi-card__name, .kr-sample-card__title, .kr-forbes__quote, .pg-stat, .kr-h3 { font-family: var(--kr-font-sans); }
.kr-testi-card__name { font-size: 18px; line-height: 24px; font-weight: var(--kr-fw-medium); letter-spacing: 0; }
.kr-sample-card__title { font-size: 18px; line-height: 24px; font-weight: var(--kr-fw-medium); letter-spacing: 0; margin: 0 0 8px; }
.pg-h4 { font: var(--kr-fw-medium) 24px/32px var(--kr-font-sans); letter-spacing: -0.4px; color: #fff; margin: 0 0 8px; }
.pg-stat { font-size: 32px; line-height: 40px; font-weight: var(--kr-fw-medium); letter-spacing: -0.4px; }
.pg-step { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--kr-blue-very-light); color: var(--kr-blue); font-weight: var(--kr-fw-medium); font-size: 14px; margin-bottom: 8px; }
.pg-forbes-mark { width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 1px var(--kr-grey-60); }

/* 8px grid: spacing from the bundle that was off-grid */
.kr-nav { padding: 16px 0; }
.kr-nav__row { gap: 32px; }
.kr-nav__list { gap: 24px; }
.kr-nav__link { padding: 8px 0; }
.kr-nav__cta { gap: 8px; }
.kr-hero__title { margin: 8px auto 24px; }
.kr-hero__sub { font-size: 18px; line-height: 28px; margin: 0 auto 32px; }
.kr-hero__proof { gap: 48px; margin-bottom: 40px; }
.kr-proof__group, .kr-proof__forbes { gap: 16px; }
.kr-proof__text { gap: 4px; }
.kr-section-title { margin-bottom: 48px; }
.kr-section-title .kr-body { margin-bottom: 0; }
.kr-section-footer { margin-top: 32px; }
.kr-h2 { margin-bottom: 16px; }
.kr-feature { padding: 80px 0; }
.kr-feature__col .kr-body { margin-bottom: 24px; }
.kr-forbes { padding: 40px; gap: 40px; margin-bottom: 16px; }
.kr-forbes__byline { gap: 8px; }
.kr-testi-card { padding: 24px; gap: 16px; border-radius: var(--kr-radius); }
.kr-sample-card__body { padding: 24px; gap: 8px; }
.kr-footer__nav li { margin-bottom: 8px; }
.kr-footer__ratings { gap: 16px; }
.kr-footer__rating-row { gap: 8px; margin-top: 8px; }
.kr-footer__socials { gap: 16px; }
.ds-card { padding: 24px; }
.ds-card h3 { margin: 16px 0 8px; }
.pg-person h3 { margin: 0 0 4px; }
.ds-card .pg-bio { margin: 8px 0 16px; }
.ds-card .pg-mt-8 { margin-top: 8px; }
.pg-intro p { margin: 0 0 24px; }
.k-checked li { padding: 4px 0; }
.pg-facts dd { margin: 4px 0 0; }
@media (max-width: 767px) { .kr-forbes { padding: 32px 24px; gap: 24px; } }

/* Cards on navy: subtle fill, white text */
.ds-card--on-dark { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.12); color: #fff; }
.ds-card--on-dark .muted { color: rgba(255, 255, 255, 0.7); }
.ds-card--on-dark .pg-link { color: #fff; }
.ds-card--on-dark .pg-avatar { background: rgba(255, 255, 255, 0.12); color: #fff; }

/* Decorations stay out from under text: no line motif on the navy band,
   hero blurs sit low, behind the illustration only */
.kr-feature.is-dark { background-image: none; }
.kr-hero--center { background-position: center bottom; background-size: 100% 55%; }
.kr-section-title .button-group { margin-top: 32px; }
.kr-feature.is-reverse .kr-feature__col { justify-self: end; }
.pg-placeholder { aspect-ratio: 16 / 9; }
@media (max-width: 899px) { .kr-feature.is-reverse .kr-feature__col { justify-self: stretch; } }

/* Founders: Landing pages 2.0 "Hero v1" layout on navy (centered head, 2 photos 400px, 2 cards; 32px gaps) */
.pg-founders { background: var(--kr-blue-dark); color: #fff; }
.pg-founders .kr-eyebrow, .pg-founders .kr-h1, .pg-founders .kr-body { color: #fff; }
.pg-founders__head { max-width: 900px; margin-bottom: 32px; }
.pg-founders__photos, .pg-founders__cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.pg-founders__photos { margin-bottom: 32px; }
.pg-founders__photo { position: relative; margin: 0; height: 400px; border-radius: var(--kr-radius-lg); overflow: hidden; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); display: grid; place-items: center; }
.pg-founders__slot { color: rgba(255, 255, 255, 0.6); font-size: 14px; }
.pg-founders__photo figcaption { position: absolute; left: 24px; bottom: 16px; font-size: 16px; line-height: 24px; color: #fff; }
.pg-founder { display: flex; gap: 16px; align-items: flex-start; padding: 16px; border-radius: var(--kr-radius-lg); }
.pg-founder__avatar { width: 96px; height: 96px; border-radius: 50%; flex: none; display: grid; place-items: center; background: rgba(255, 255, 255, 0.12); color: #fff; font-size: 24px; font-weight: var(--kr-fw-medium); }
.pg-founder h3 { margin: 0 0 8px; }
.pg-founder .muted { margin: 0; }
@media (max-width: 767px) {
  .pg-founders__photos, .pg-founders__cards { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .pg-founders__photo { height: 240px; }
  .pg-founder__avatar { width: 64px; height: 64px; font-size: 18px; }
}

/* Hero proof row (Landing pages 2.0 · Combined proof) */
.pg-proofrow { gap: 16px; }
.pg-pill { display: flex; align-items: center; gap: 8px; height: 64px; padding: 12px 16px; border-radius: 16px; background: rgba(255,255,255,.2); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.pg-pill .kr-proof__text { gap: 4px; }
.pg-pill .kr-proof__text > strong { font-size: 14px; line-height: 20px; font-weight: var(--kr-fw-medium); color: var(--kr-fg); }
.pg-pill .kr-proof__text > span { font-size: 12px; line-height: 18px; color: var(--kr-fg); }
.pg-pill:first-child .kr-proof__text > span { color: var(--kr-fg-muted); }
.pg-pill .kr-proof__avatars { margin-right: 4px; }
.pg-pill .kr-proof__av, .pg-pill .kr-proof__count { width: 48px; height: 48px; margin-right: -24px; }
.pg-pill .kr-proof__count { margin-right: 0; background: rgba(255,255,255,.8); box-shadow: none; font-weight: var(--kr-fw-medium); }
.pg-av--1 { background: #f3d9c9; } .pg-av--2 { background: #d9dcf5; } .pg-av--3 { background: #cfe8dd; }
.pg-parwcc { display: grid; grid-template-columns: repeat(2, 14px); gap: 1px; width: 40px; justify-content: center; }
.pg-parwcc i { display: flex; align-items: center; justify-content: center; height: 12px; font-style: normal; font-size: 8px; font-weight: var(--kr-fw-semibold, 600); color: #fff; background: #1d3f8f; }
.pg-parwcc i:nth-child(n+3):nth-child(-n+4) { background: #fff; color: #1d3f8f; box-shadow: inset 0 0 0 1px #1d3f8f; }
.pg-parwcc i:nth-child(n+5) { background: #3a9ad9; }

/* Reviews (Landing pages 2.0 · Proof - light) */
.pg-proof .kr-section-title { margin-bottom: 40px; }
.pg-proof__wrap { display: flex; justify-content: space-between; align-items: center; gap: 24px; max-width: 1010px; margin: 0 auto; padding: 0 32px; }
.pg-proof__card { display: flex; align-items: center; gap: 8px; padding: 16px; border-radius: 16px; background: var(--kr-grey-20, #fafafa); }
.pg-proof__icon { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; flex: none; }
.pg-proof__content { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding-right: 16px; }
.pg-proof__name { margin: 0; font-family: var(--kr-font-sans); font-size: 16px; line-height: 24px; font-weight: var(--kr-fw-medium); color: var(--kr-fg); }
.pg-proof__score { font-size: 14px; line-height: 20px; color: var(--kr-fg); padding: 0 2px; }
.pg-proof__card--tp { flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; width: 284px; height: 132px; padding: 16px 24px; }
.pg-tp__brand { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 16px; line-height: 20px; color: var(--kr-fg); }
.pg-tp__stars { display: flex; gap: 6px; }
.pg-tp__star { width: 32px; height: 32px; background: #00b67a; display: flex; align-items: center; justify-content: center; }
.pg-tp__star.is-part { background: linear-gradient(90deg, #00b67a 60%, #dcdce6 60%); }
.pg-tp__star svg { width: 24px; height: 24px; }
.pg-tp__score { margin: 0; font-size: 15px; line-height: 24px; color: var(--kr-fg); }
.pg-tp__score span { margin: 0 4px; }
.pg-textlink { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 24px; font-size: 14px; line-height: 20px; font-weight: var(--kr-fw-medium); color: var(--kr-fg); text-decoration: underline; text-underline-offset: 3px; }
.pg-textlink svg { width: 20px; height: 20px; }
.pg-textlink { border-radius: 10px; transition: background-color .15s; }
.pg-textlink:hover, .pg-textlink:focus-visible { background: var(--kr-grey-40); }
@media (max-width: 991px) {
  .pg-proof__wrap { flex-direction: column; align-items: stretch; padding: 0; max-width: 400px; }
  .pg-proof__card--tp { width: auto; }
}

/* Press (Landing pages 2.0 · Merge guides & blog) */
.pg-press-section { position: relative; overflow: hidden; isolation: isolate; background: var(--kr-background); }
.pg-press-section .ds-card, .pg-press-section .ds-card--tinted { background: #fff; border-color: var(--kr-grey-60); }
.pg-press-section .kr-section-title .button-group { margin-top: 16px; }
.pg-press-section .kr-section-title { margin-bottom: 64px; max-width: 1260px; }
.pg-press-section .kr-section-title .kr-body { max-width: 900px; margin-left: auto; margin-right: auto; }
.pg-press { grid-template-columns: repeat(3, minmax(0, 300px)); justify-content: center; gap: 24px; }
.pg-press-card { display: flex; flex-direction: column; border: 1px solid var(--kr-grey-60, #e9e9e9); border-radius: 24px; overflow: hidden; background: #fff; color: inherit; text-decoration: none; transition: box-shadow .2s; }
.pg-press-card:hover { box-shadow: var(--kr-shadow-dropdown); }
.pg-press-card__media { height: 150px; display: flex; align-items: center; justify-content: center; padding: 16px; background: linear-gradient(135deg, #e8edfb, #f6e9ef); }
.pg-press-card__media span { font-family: Georgia, "Times New Roman", serif; font-size: 22px; line-height: 28px; color: #081430; text-align: center; }
.pg-press-card__body { display: flex; flex-direction: column; gap: 8px; padding: 16px 24px 24px; flex: 1; }
.pg-press-card__pre { font-size: 14px; color: var(--kr-grey-80, #8c8c8c); }
.pg-press-card__title { margin: 0; font-family: var(--kr-font-sans); font-size: 18px; line-height: 24px; font-weight: var(--kr-fw-medium); color: var(--kr-fg); }
.pg-press-card__cta { margin-top: auto; padding-top: 8px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: var(--kr-fw-medium); color: var(--kr-fg); }
.pg-press-card__cta svg { width: 16px; height: 16px; }
@media (max-width: 991px) { .pg-press { grid-template-columns: repeat(2, minmax(0, 300px)); } }
@media (max-width: 639px) { .pg-press { grid-template-columns: minmax(0, 1fr); } }

/* Team (Landing pages 2.0 · Team / authors update) */
.pg-team-section { background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0) 100%), #f4f7f8; }
.pg-team-section .kr-section-title { margin-bottom: 40px; }
.pg-authors { display: grid; grid-template-columns: repeat(2, minmax(0, 554px)); justify-content: center; gap: 32px; }
.pg-author { display: flex; gap: 16px; align-items: flex-start; padding: 16px; background: #fff; border: 1px solid var(--kr-grey-40, #f2f2f2); border-radius: 24px; }
.pg-author__photo { width: 100px; height: 100px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #e9e9e9; color: var(--kr-fg); font-size: 24px; font-weight: var(--kr-fw-medium); }
.pg-author__body { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pg-author__name { margin: 0; font-family: var(--kr-font-sans); font-size: 20px; line-height: 32px; font-weight: var(--kr-fw-medium); color: var(--kr-fg); }
.pg-author__role { margin: 8px 0 0; font-size: 14px; line-height: 20px; color: rgba(63,63,63,.5); }
.pg-author__bio { margin: 0; font-size: 14px; line-height: 20px; color: var(--kr-fg); }

<body>

<script>
(function () {
  var DS = window.KickresumeDesignSystem_6ee106;
  var Navbar = DS.Navbar, Button = DS.Button, Eyebrow = DS.Eyebrow, StarRow = DS.StarRow;
  var html = htm.bind(React.createElement);
  var A = {
    logoWhite: "{{asset:logos/kickresume-white.svg}}",
    forbes: "{{asset:logos/logo-forbes.svg}}",
    forbesWhite: "{{asset:logos/logo-forbes-symbol-white.svg}}",

  };
  var ext = { target: "_blank", rel: "noopener" };

  function Check(props) { return html`<li><i data-lucide="check"></i><span>${props.children}</span></li>`; }

  function Intro() {
    return html`
      <section className="kr-hero kr-hero--center" aria-labelledby="about-title">
        <div className="kr-container kr-container--wide">
          <${Eyebrow}>About Kickresume<//>
          <h1 id="about-title" className="kr-h1 kr-hero__title">Kickresume is a real company you can trust.</h1>
          <p className="kr-hero__sub">For over a decade, Kickresume has been the resume builder job seekers trust to tell their story. Named the #1 resume builder overall by Forbes, we’ve helped more than 9 million people worldwide land roles at the world’s most sought-after companies: from Google to Apple and SpaceX.</p>

            <div className="pg-pill">

                <span className="kr-proof__av pg-av pg-av--1"></span>
                <span className="kr-proof__av pg-av pg-av--2"></span>
                <span className="kr-proof__av pg-av pg-av--3"></span>
                <span className="kr-proof__count">9M+</span>
              </div>
              <div className="kr-proof__text"><${StarRow} value=${4.6} /><span>job seekers helped since 2013</span></div>
            </div>
            <div className="pg-pill">
              <img className="pg-forbes-mark" src=${A.forbesWhite} alt="" width="40" height="40" />
              <div className="kr-proof__text"><strong>Forbes</strong><span>Best Resume Builder Overall</span></div>
            </div>
            <div className="pg-pill">
              <span className="pg-parwcc" aria-hidden="true">${["P", "A", "R", "W", "C", "C"].map(function (l, i) { return html`<i key=${i}>${l}</i>`; })}</span>

      </section>
      <section className="pg-section" style=${{ paddingTop: 48 }}>
        <div className="kr-container">
          <div className="pg-intro kr-body">
            <p>Today's Kickresume is a full AI-powered career toolkit, helping candidates write standout resumes and cover letters, pass ATS checks, prepare for interviews, and even plan their next career move.</p>
            <p>Our work has been recognized and cited by media such as The Wall Street Journal, CNBC, Fast Company, Business Insider, and the New York Post. We're also affiliated with the PARWCC (Professional Association of Resume Writers & Career Coaches), with who we even did a joint research study.</p>

  var GOOGLE_G = html`<svg viewBox="0 0 48 48" width="60" height="60" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`;
